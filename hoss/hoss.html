  WHAT THIS IS
  A single, self-contained HTML file for manager decision support: roster,
  manager ratings (1 to 5), skills, system tags, team coverage, redeployment
  matching, staffing and reduction scenarios, and shared services planning.
  It is not an HR system and does not connect to one.

  SECURITY AND DATA HANDLING NOTES (for reviewers)
  * No network access of any kind: no network APIs are used, no external
    scripts, styles, fonts or images. Everything is inline in this file.
  * No eval, no dynamic code, no cookies. Optional password protection of the
    data file uses the browser's built-in Web Crypto (AES-256-GCM, key from
    PBKDF2-SHA-256). A password field only appears when the user sets or
    enters a password. Unprotected files remain the default and are unchanged.
  * Data lives only in a JSON file the user picks (File System Access API in
    Edge). Every save is read back and compared before it is marked saved.
    Each file carries a SHA-256 checksum (pure JavaScript).
  * Optional versioned backups go to a folder the user picks.
  * Optional recovery copies are kept in this browser's IndexedDB/localStorage
    (can be turned off in Data & Setup). Nothing else is stored in the browser
    except display preferences (theme, your name for save stamps).
  * Imports accept plain text only (.csv, .tsv, .txt, pasted cells, or a HOSS
    .json file) with size, row, column and cell-length limits.
  * Blob downloads are used only for exports and for saving when direct
    file access is unavailable.

*{box-sizing:border-box}
html,body{margin:0}
body{font:13px/1.45 var(--font);color:var(--ink);background:var(--bg);min-height:100vh;display:flex;flex-direction:column}
body.athome{background:var(--homebg)}
a{color:var(--acc-ink)}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{background:var(--inp);border:1px solid var(--line2);border-radius:6px;padding:5px 7px;color:var(--ink);min-width:0}
::placeholder{color:var(--mute);opacity:.7}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid rgba(var(--acc-rgb),.7);outline-offset:1px}
button{background:var(--panel2);border:1px solid var(--line2);border-radius:7px;padding:5px 12px;cursor:pointer}
button:hover{background:var(--hover)}
button:disabled{opacity:.45;cursor:default}
button.pri{background:var(--accbtn);border-color:var(--accbtn);color:#fff;font-weight:600}
button.pri:hover{filter:brightness(1.08);background:var(--accbtn)}
button.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 55%,transparent)}
button.danger-solid{background:var(--bad);border-color:var(--bad);color:#fff}
button.warn{background:var(--warn);border-color:var(--warn);color:#1a1300}
button.sm{padding:2px 9px;font-size:12px}
button.link{background:none;border:0;padding:0;color:var(--acc-ink);text-decoration:underline}
.mono{font-family:var(--mono)}
.mute{color:var(--mute)}
.center{text-align:center}
.nowrap{white-space:nowrap}
.ok-t{color:var(--ok)}.bad-t{color:var(--bad)}.warn-t{color:var(--warn)}
kbd{font:600 10px/1 var(--mono);border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:2px 5px;background:var(--panel2)}

/* ---------------- Marking banner ---------------- */
.markbar{background:#241b3d;color:#e9ddff;font:600 11px/1.9 var(--mono);letter-spacing:.14em;text-transform:uppercase;text-align:center}
.markbar.bottom{display:none}
.markbar:empty{display:none!important}

/* ---------------- Header ---------------- */
header.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;min-height:60px;padding:0 18px;background:var(--h-bg);color:var(--h-ink);border-bottom:1px solid var(--h-line)}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;background:none;border:0;padding:0;color:inherit;text-align:left;flex:none}
.brand:hover{background:none}
#logoSlot{display:flex;line-height:0}
.mark{width:34px;height:34px;flex:none}
.mark.big{width:72px;height:72px}
.mark .bars rect{transform-box:fill-box;transform-origin:50% 100%;animation:hossrise .75s cubic-bezier(.2,.8,.25,1.15) both}
.mark.p1 .gb{transform-box:fill-box;transform-origin:50% 50%;animation:hossbar .6s ease}
.mark.p2 .gb{transform-box:fill-box;transform-origin:50% 50%;animation:hossbar2 .6s ease}
@keyframes hossbar{0%{transform:scaleX(.45);opacity:.4}60%{transform:scaleX(1.12);opacity:1}100%{transform:scaleX(1)}}
@keyframes hossbar2{0%{transform:scaleX(.45);opacity:.4}60%{transform:scaleX(1.12);opacity:1}100%{transform:scaleX(1)}}
@keyframes hossrise{0%{transform:scaleY(.15);opacity:.35}70%{transform:scaleY(1.08);opacity:1}100%{transform:scaleY(1)}}
.btxt{display:flex;flex-direction:column;justify-content:center;gap:2px}
.wrow{display:flex;align-items:baseline;gap:7px}
.wm{font-family:var(--disp);font-weight:700;font-size:19px;letter-spacing:.03em;line-height:1;color:var(--ink)}
.wm b{color:inherit;font-weight:inherit}
.vtag{font:600 11px/1 var(--font);letter-spacing:.03em;color:var(--gold)}
.vtag:empty{display:none}
.sub{font:500 11px/1.25 var(--font);color:var(--mute);white-space:nowrap}
header.top .wm{color:#f2f3fb}
header.top .vtag{color:#f5c542}
header.top .sub{color:var(--h-mute)}
.hsep{width:1px;height:28px;background:var(--h-chipline);flex:none}
.fgroup{display:flex;align-items:center;gap:9px;height:34px;padding:0 12px;border-radius:8px;background:var(--h-chip);border:1px solid var(--h-chipline);min-width:0;max-width:460px}
.filechip{font:13px var(--mono);color:var(--h-ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.filechip:empty{display:none}
.lockchip{display:inline-flex;align-items:center;color:#c4b5fd;flex:none}
.lockchip:empty{display:none}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;white-space:nowrap;cursor:pointer;border-left:1px solid var(--h-chipline);padding-left:9px;color:#c8cde0;flex:none}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.st:hover{color:#fff}
.st.ok{color:#9fe0bd}.st.warn{color:#fcd34d}.st.bad{color:#fca5a5;font-weight:600}.st.busy{color:#ddd6fe}.st.info{color:#bfdbfe}
.st:empty{display:none}
.sp{flex:1}
.scnchip{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 4px 0 12px;border-radius:8px;border:1px solid #5b3fb5;background:#1a1636;white-space:nowrap;flex:none}
.scnchip[hidden]{display:none}
.scnlab{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#c4b5fd}
.scnchip select{height:28px;border:0;background:transparent;color:var(--h-ink);font-size:13px;font-weight:600;max-width:230px;padding:0 4px;cursor:pointer}
.scnchip select option{background:#1a2038;color:#eef0fa}
.hb{height:36px;display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--h-chip);border:1px solid var(--h-chipline);color:#c8cde0;border-radius:8px;padding:0 12px;flex:none}
.hb:hover{background:var(--h-hover);color:#fff}
.hb.icon{width:36px;padding:0}
.hb.icon svg{width:16px;height:16px}
.hb.pri{background:#7c3aed;border-color:#7c3aed;color:#fff;font-weight:600;padding:0 18px}
.hb.pri:hover{background:#8b4cf2}
.hicons{display:flex;gap:4px;flex:none}
.hmenuwrap{position:relative;display:inline-flex;flex:none}
.hmenu{position:absolute;right:0;top:calc(100% + 8px);min-width:230px;background:var(--panel);color:var(--ink);border:1px solid var(--line2);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.4);padding:6px;z-index:60;display:flex;flex-direction:column}
.hmenu[hidden]{display:none}
.hmenu button,.hmenu label{background:none;border:0;border-radius:6px;padding:9px 12px;text-align:left;font-size:13px;color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:8px;width:100%}
.hmenu button:hover,.hmenu label:hover{background:var(--hover)}
.hmenu hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
.hmenu [hidden]{display:none}
/* Staffing | Financials. Financials stays red with a lock (owner's choice) so it never reads as Exit. */
.viewsw{display:inline-flex;padding:3px;border-radius:9px;background:var(--h-chip);border:1px solid var(--h-chipline);white-space:nowrap;flex:none}
.viewsw .vs{height:30px;padding:0 12px;border:0;border-radius:7px;background:transparent;color:#c8cde0;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.viewsw .vs svg{width:13px;height:13px;flex:none}
.viewsw .vs:hover{background:var(--h-hover);color:#fff}
.viewsw .vs[aria-checked=true]{background:#2b2453;color:#fff}
.viewsw .vs.fin{color:#f08a8d}
.viewsw .vs.fin[aria-checked=true]{background:#3a1a22;color:#ffc9cb}
.viewsw .vs:focus-visible{outline:2px solid #fff;outline-offset:-3px}
/* On the home screen only the More menu shows, floating top right. */
body.athome header.top{position:fixed;top:16px;right:20px;left:auto;min-height:0;padding:0;background:none;border:0}
body.athome header.top>*:not(.hmenuwrap){display:none!important}
body.athome header.top .hb.icon{background:var(--panel);border-color:var(--line);color:var(--ink)}

/* ---------------- Tabs, grouped ---------------- */
nav.tabs{position:sticky;top:var(--hdrH,60px);z-index:29;display:flex;align-items:stretch;gap:2px;min-height:48px;padding:0 14px;background:var(--nav);border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs:empty{display:none}
nav.tabs button{background:none;border:0;border-radius:0;padding:0 10px;color:var(--mute);white-space:nowrap;font-size:13.5px}
nav.tabs button:hover{color:var(--ink);background:var(--hover)}
nav.tabs button.on{color:var(--ink);font-weight:600;background:var(--accsoft);box-shadow:inset 0 -2px 0 var(--acc)}
nav.tabs button.navback{align-self:center;height:32px;display:inline-flex;align-items:center;gap:3px;padding:0 10px 0 7px;margin-right:4px;border:1px solid var(--line2);border-radius:7px;color:var(--ink);font-size:13px}
nav.tabs button.navback:disabled{opacity:.4}
.tgroup{position:relative;display:flex;align-items:stretch;gap:2px;padding:0 6px 0 8px;margin-right:6px;background:linear-gradient(90deg,rgba(var(--gc),.22),rgba(var(--gc),.07) 62%,rgba(var(--gc),0))}
.tgroup::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,rgba(var(--gc),.85),rgba(var(--gc),0))}
.tgroup::before{content:"";align-self:stretch;width:3px;margin:0 6px 0 -8px;background:rgb(var(--gc));flex:none;border-radius:0 2px 2px 0}
.tglab{align-self:center;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgb(var(--gc));margin-right:5px;white-space:nowrap}
nav.tabs .tgroup button:hover{background:rgba(var(--gc),.14)}
nav.tabs .tgroup button.on{background:rgba(var(--gc),.30);box-shadow:inset 0 -3px 0 rgb(var(--gc))}
.g-a{--gc:57,135,229}.g-p{--gc:25,158,112}.g-l{--gc:201,133,0}.g-m{--gc:140,150,180}
html[data-theme=light] .g-a{--gc:42,120,214}
html[data-theme=light] .g-p{--gc:20,140,98}
html[data-theme=light] .g-l{--gc:190,115,0}
html[data-theme=light] .g-m{--gc:100,110,140}
html[data-theme=light] .tgroup{background:linear-gradient(90deg,rgba(var(--gc),.20),rgba(var(--gc),.06) 62%,rgba(var(--gc),0))}
html[data-theme=light] .tglab{filter:brightness(.82)}
.tspacer{flex:1 1 auto;min-width:8px}
.admin{position:relative;display:flex;align-items:stretch;flex:none}
nav.tabs .admin>button.abtn{display:inline-flex;align-items:center;gap:6px;padding:0 12px;background:rgba(var(--gc),.14);color:var(--ink);font-weight:600;box-shadow:inset 0 -2px 0 rgba(var(--gc),.8)}
nav.tabs .admin>button.abtn:hover{background:rgba(var(--gc),.26)}
nav.tabs .admin>button.abtn.on{background:rgba(var(--gc),.30)}
.abtn svg{transition:transform .25s ease}
.admin.open .abtn svg{transform:rotate(180deg)}
.aslide{position:absolute;right:100%;top:0;bottom:0;display:flex;align-items:stretch;gap:2px;overflow:hidden;max-width:0;opacity:0;visibility:hidden;background:var(--nav);transition:max-width .28s cubic-bezier(.2,.8,.2,1),opacity .2s ease,visibility 0s linear .28s;box-shadow:-10px 0 14px -10px rgba(0,0,0,.35)}
.admin.open .aslide{max-width:340px;opacity:1;visibility:visible;transition:max-width .28s cubic-bezier(.2,.8,.2,1),opacity .2s ease,visibility 0s}
.aslide-in{display:flex;align-items:stretch;gap:2px;padding:0 8px;background:linear-gradient(270deg,rgba(var(--gc),.22),rgba(var(--gc),.06))}
@media (prefers-reduced-motion:reduce){.aslide,.abtn svg{transition:none}}

/* ---------------- Layout ---------------- */
main{padding:20px 24px;flex:1}
#banners:empty{display:none}
#banners{padding:12px 24px 0}
.banner{background:color-mix(in srgb,var(--warn) 12%,transparent);border:1px solid color-mix(in srgb,var(--warn) 50%,transparent);border-radius:10px;padding:9px 14px;margin-bottom:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.bad{background:color-mix(in srgb,var(--bad) 12%,transparent);border-color:color-mix(in srgb,var(--bad) 55%,transparent)}
.banner.info{background:color-mix(in srgb,var(--info) 10%,transparent);border-color:color-mix(in srgb,var(--info) 45%,transparent)}
.banner.ok{background:color-mix(in srgb,var(--ok) 10%,transparent);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.banner .grow{flex:1}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:16px;box-shadow:var(--shadow)}
.panel h3{margin:0 0 10px;font-size:16px;font-weight:600}
.panel h4{margin:14px 0 6px;font-size:13px}
.ptitle{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:0 0 16px}
.ptitle h2{margin:0;font-size:22px;font-weight:600}
.ptitle .grow{flex:1}
.bar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:flex-end}
.bar label,.fl{display:flex;flex-direction:column;font-size:12px;color:var(--mute);gap:3px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:5px 0}
.chk{display:inline-flex!important;flex-direction:row!important;align-items:center;gap:6px;color:var(--ink)!important;font-size:12.5px!important}
details summary{cursor:pointer;color:var(--acc-ink);margin:8px 0 4px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.cards{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px;min-width:130px}
.card b{display:block;font-size:24px;font-family:var(--disp)}
.card span{font-size:12px;color:var(--mute)}

/* ---------------- Tables ---------------- */
.tw{overflow:auto;max-height:calc(100vh - 330px);border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table.tbl{border-collapse:collapse;width:100%;background:var(--panel)}
.tbl th,.tbl td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.tbl th{background:var(--panel2);position:sticky;top:0;z-index:1;font-size:12px;white-space:nowrap;color:var(--mute);font-weight:600}
.tbl th.sortable{cursor:pointer}
.tbl th.sortable:hover{color:var(--ink)}
.tbl tbody tr:hover td{background:var(--hover)}
.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr.d-exit td:nth-child(2){box-shadow:inset 3px 0 var(--dexit)}
.tbl tr.d-redeploy td:nth-child(2){box-shadow:inset 3px 0 var(--dredeploy)}
.tbl tr.d-retain td:nth-child(2){box-shadow:inset 3px 0 var(--dretain)}
.tbl tr.vac td{font-style:italic}
.chip{display:inline-block;background:rgba(var(--acc-rgb),.14);border:1px solid rgba(var(--acc-rgb),.28);border-radius:6px;padding:0 7px;margin:1px 3px 1px 0;font-size:11.5px;white-space:nowrap}
.chip.lost{background:color-mix(in srgb,var(--bad) 16%,transparent);border-color:color-mix(in srgb,var(--bad) 50%,transparent)}
.chip.thin{background:color-mix(in srgb,var(--warn) 16%,transparent);border-color:color-mix(in srgb,var(--warn) 50%,transparent)}
.chip.sys{background:var(--panel2);border-color:var(--line2)}
.badge{font:600 10px/1.5 var(--mono);padding:0 5px;border-radius:4px;margin-left:5px;color:#fff;background:#64748b;vertical-align:1px}
.badge.k{background:#b45309}.badge.r{background:#2563eb}.badge.o{background:#7c3aed}.badge.v{background:#475569}
/* rating chips and the roster rating picker share one scale */
.rp{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:22px;padding:0 6px;border-radius:6px;font:700 12px/1 var(--font);background:var(--panel2);color:var(--mute);border:1px solid var(--line2)}
select.rate{width:58px;font-weight:700;border-color:transparent}
select.rate option{background:var(--inp);color:var(--ink);font-weight:400}
.rp.r0,select.rate.r0{background:var(--panel2);color:var(--mute);border-color:var(--line2)}
.rp.r1,select.rate.r1{background:var(--r1);color:var(--ri1);border-color:transparent}
.rp.r2,select.rate.r2{background:var(--r2);color:var(--ri2);border-color:transparent}
.rp.r3,select.rate.r3{background:var(--r3);color:var(--ri3);border-color:transparent}
.rp.r4,select.rate.r4{background:var(--r4);color:var(--ri4);border-color:transparent}
.rp.r5,select.rate.r5{background:var(--r5);color:var(--ri5);border-color:transparent}
.dist{display:flex;gap:1px;height:16px;min-width:120px;border-radius:4px;overflow:hidden}
.dist span{font-size:10px;font-weight:600;text-align:center;line-height:16px;overflow:hidden}
.heat td.c{text-align:center;min-width:36px;padding:3px 2px;color:#111;font-variant-numeric:tabular-nums}
.heat th.v{height:140px;vertical-align:bottom;padding:4px 2px;min-width:36px}
.heat th.v div{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;margin:0 auto;cursor:pointer}
.heat td.s,.heat th.s{position:sticky;left:0;background:var(--panel2);z-index:2;white-space:nowrap}
.heat th.s{z-index:3}
.legend span{display:inline-block;padding:0 8px;margin-right:4px;border-radius:4px;font-size:11px}
.lvl-bad{color:var(--bad);font-weight:600}.lvl-warn{color:var(--warn);font-weight:600}.lvl-info{color:var(--info);font-weight:600}.lvl-ok{color:var(--ok);font-weight:600}
.tbl.plain th{position:static}

/* ---------------- Roster toolbar, filters popover, filter pills ---------------- */
.rtool{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rtool .grow{flex:1}
.rsearch{display:flex;align-items:center;gap:8px;width:340px;max-width:100%;height:36px;padding:0 10px;border:1px solid var(--line2);border-radius:8px;background:var(--inp);color:var(--mute)}
.rsearch:focus-within{outline:2px solid rgba(var(--acc-rgb),.7);outline-offset:1px}
.rsearch input{flex:1;border:0;background:transparent;padding:0;height:100%;outline:none}
.fwrap{position:relative;display:inline-flex}
.fbtn{height:36px;display:inline-flex;align-items:center;gap:8px;font-weight:600}
.fbtn.on,.fbtn[aria-expanded=true]{border-color:var(--accline);background:var(--accsoft)}
.fcount{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--accbtn);color:#fff;font-size:11px;display:inline-flex;align-items:center;justify-content:center}
.fcount:empty{display:none}
.fpop{position:absolute;top:calc(100% + 8px);left:0;z-index:25;width:min(920px,calc(100vw - 420px));max-height:calc(100vh - 210px);overflow-y:auto;padding:16px 18px;border-radius:12px;background:var(--panel);border:1px solid var(--line2);box-shadow:0 16px 40px rgba(0,0,0,.45)}
.fpop[hidden]{display:none}
.fphead{display:flex;justify-content:space-between;align-items:center;margin:0 0 12px}
.fphead h3{margin:0;font-size:15px}
.fgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 14px}
.fgrid .fmore{grid-column:1/-1;margin:6px 0 -2px;padding-top:10px;border-top:1px solid var(--line);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.fgrid label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mute)}
.fgrid select{height:32px}
.fgrid select.set{border-color:var(--acc)}
.fpfoot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.fpills{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:12px 0 0}
.fpills:empty{display:none}
.pill{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 7px 0 12px;border-radius:999px;border:1px solid var(--accline);background:var(--accsoft);color:var(--ink);font-size:12.5px}
.pill:hover{background:var(--accsoft);filter:brightness(1.12)}
.pill i{font-style:normal;font-size:15px;line-height:1;opacity:.8}
.rmeta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0 8px}
.rmeta .grow{flex:1}

/* ---------------- Home ---------------- */
.home{max-width:1000px;margin:0 auto;padding:clamp(40px,9vh,100px) 16px 24px}
.hero{display:flex;align-items:center;justify-content:center;gap:34px}
.mwrap{position:relative;display:block;width:128px;height:128px;flex:none;isolation:isolate}
.mwrap .mark.big{width:128px;height:128px;display:block}
.mwrap::before{content:"";position:absolute;inset:-6px;border-radius:32px;padding:1.5px;z-index:1;pointer-events:none;
  background:linear-gradient(160deg,#ffe3a1,#c8922f 45%,rgba(200,146,47,.35) 70%,#e0b24a);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.mwrap::after{content:"";position:absolute;inset:-120px -160px;z-index:-1;pointer-events:none;border-radius:50%;background:radial-gradient(closest-side,rgba(124,58,237,.30),rgba(124,58,237,0))}
html[data-theme=light] .mwrap::after{background:radial-gradient(closest-side,rgba(124,58,237,.16),rgba(124,58,237,0))}
.hlock{display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding-left:28px;
  background:linear-gradient(180deg,rgba(217,168,76,0),rgba(217,168,76,.8) 20%,rgba(217,168,76,.8) 80%,rgba(217,168,76,0)) 0 0/1px 100% no-repeat}

.sub.big{font-size:13px;letter-spacing:.14em;text-transform:uppercase;margin-top:8px;font-weight:700;white-space:normal}
.hlock .wm.big{position:relative;font-family:"HOSS Wordmark","Segoe UI Variable Display","Segoe UI",sans-serif;font-weight:600;font-size:72px;line-height:1;letter-spacing:.01em;margin:-.07em -.01em -.07em 0;padding:.07em 0;color:#f6f4ff}
.hlock .wm.big::after{content:"";position:absolute;left:100%;bottom:.07em;width:.13em;height:.13em;margin-left:.06em;border-radius:2px;background:#e0b24a}
.hlock .sub.big{margin:0;line-height:1.6;letter-spacing:.18em;color:#cfd3ea}
.hlock .sub.big .l1,.hlock .sub.big .l2{display:block;width:max-content}
.hlock .sub.big .l2{color:#9aa0c4}
.hlock .vtag.big{margin:0;font-size:11.5px;padding:2px 9px;line-height:1.4;letter-spacing:.08em;border:1px solid rgba(201,154,66,.55);border-radius:999px;background:rgba(201,154,66,.1);color:#f5c542}
html[data-theme=light] .hlock .wm.big{color:#1d2140}
html[data-theme=light] .hlock .wm.big::after{background:#c8922f}
html[data-theme=light] .hlock .sub.big{color:#1d2140}
html[data-theme=light] .hlock .sub.big .l2{color:#4a5272}
html[data-theme=light] .hlock .vtag.big{color:#8a5d0e}
@supports (text-box-trim:trim-both){
  .hero{align-items:stretch}
  .hero .mwrap{align-self:center}

  .hlock .wm.big,.hlock .sub.big{text-box:trim-both cap alphabetic}
}
.pwdrop{width:min(460px,100%);margin:32px auto 0;padding:16px 18px;border-radius:14px;background:var(--panel);border:1px solid var(--accline);box-shadow:0 12px 32px rgba(0,0,0,.35);text-align:left}
.pwdrop[hidden]{display:none}
.pwdrop h4{margin:0 0 4px;font-size:15px}
.pwdrop p{margin:0 0 8px;font-size:13px;color:var(--mute)}
.pwdrop input{width:100%;padding:9px 11px;font-size:14px;border-radius:8px}
.pwdrop .row{margin:10px 0 0}
.home .banner{max-width:960px;margin:24px auto 0}
.homegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;max-width:960px;margin:44px auto 0;align-items:start}
.homegrid:has(> .hcard:only-child){max-width:520px}
.hcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 24px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.hcard h3{margin:0;font-size:18px;font-weight:600;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.hcard h3 small{font-size:12px;font-weight:400;color:var(--mute)}
.hcard.resume{border-color:var(--accline)}
.hcard .row{margin:0}
.rfile{display:flex;gap:12px;align-items:center;padding:12px 14px;background:var(--bg);border:1px solid var(--line);border-radius:10px;min-width:0}
.rfile svg{flex:none;color:var(--acc-ink)}
.rfile>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.rfile .mono{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rfile .mute{font-size:13px}
.bigbtn{height:48px;font-size:15px;border-radius:10px;width:100%}
.hcard .note{margin:0;font-size:12px;line-height:1.5;color:var(--mute)}
.sbtn{display:flex;gap:14px;align-items:center;text-align:left;min-height:58px;padding:10px 14px;border-radius:10px;border:1px solid var(--line2);background:var(--panel2);width:100%}
.sbtn:hover{border-color:var(--accline);background:var(--hover)}
.sbtn.lead{border-color:var(--accline);background:var(--accsoft)}
.sbic{width:34px;height:34px;border-radius:8px;background:var(--accsoft);color:var(--acc-ink);display:flex;align-items:center;justify-content:center;flex:none}
.sbtn.lead .sbic{background:var(--accbtn);color:#fff}
.sbic svg{width:18px;height:18px}
.sbt{display:flex;flex-direction:column;gap:2px;min-width:0}
.sbt b{font-size:14px;font-weight:600}
.sbt span{font-size:12px;color:var(--mute)}
.wsrow{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;margin:30px 0 0}
.wsctl{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}
.wslab{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.wshint{font-size:12.5px;color:var(--mute)}
.viewsw.big{background:var(--panel);border-color:var(--line)}
.viewsw.big .vs{height:34px;padding:0 16px;color:var(--ink)}
.viewsw.big .vs:hover{background:var(--hover);color:var(--ink)}
.viewsw.big .vs[aria-checked=true]{background:var(--accsoft);color:var(--ink)}
.viewsw.big .vs.fin{color:var(--bad)}
.viewsw.big .vs.fin[aria-checked=true]{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.viewsw.big .vs:focus-visible{outline:2px solid var(--acc)}
body[data-view=fin] .homegrid{opacity:.4;filter:saturate(.5)}
.homegrid{transition:opacity .25s}
.datanote{display:flex;align-items:center;justify-content:center;gap:8px;margin:32px 0 0;font-size:13px;color:var(--mute)}
.datanote svg{color:var(--ok);flex:none}
.legalbar{text-align:center;font-size:12.5px;line-height:1.55;color:var(--mute);padding:12px 16px;border-top:1px solid var(--line)}
.legalbar[hidden]{display:none}
.legalbar>div:first-child{color:var(--ink)}
.legalbar .lb2{font-size:12px}
.legalbar .link{font-size:12px;color:var(--acc-ink)}
.legalbar + footer.foot{border-top:0}
footer.foot{padding:10px 16px;text-align:center;font:12px var(--font);letter-spacing:.04em;color:var(--mute);border-top:1px solid var(--line)}

/* ---------------- Team board ---------------- */
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
.bcol{flex:0 0 240px;background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;max-height:calc(100vh - 250px)}
.bcol.over{outline:2px dashed var(--acc);outline-offset:2px}
.bhead{position:relative;padding:9px 11px;border-bottom:1px solid var(--line)}
.bhead .bt{font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bhead .bt2{padding-right:28px}
.bhead .bs{font-size:11.5px;color:var(--mute)}
.bren{position:absolute;top:6px;right:6px;padding:1px 6px;opacity:.6}.bren:hover,.bren:focus{opacity:1}
.bcol.exitcol .bt{color:var(--dexit)}
.bcol.tbdcol .bt{color:var(--dredeploy)}
.bcol.closedcol .bt{color:var(--mute)}
.bbody{overflow-y:auto;padding:8px;flex:1;min-height:70px}
.bcard{background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--line2);border-radius:8px;padding:7px 9px;margin-bottom:6px;cursor:grab}
.bcard:hover{border-color:rgba(var(--acc-rgb),.6)}
.bcard.retain{border-left-color:var(--dretain)}.bcard.exit{border-left-color:var(--dexit)}.bcard.redeploy{border-left-color:var(--dredeploy)}
.bcard.vac{border-style:dashed;border-left-style:dashed;cursor:pointer;opacity:.85}
.bcard.vac.pipe{border-left-color:var(--dpipe);opacity:1}
.bcard.dragging{opacity:.4}
.bc1{display:flex;justify-content:space-between;gap:6px;align-items:center}
.bn{font-weight:600;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bc2{font-size:11.5px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{display:inline-block;font-size:10.5px;margin-top:3px;padding:0 6px;border-radius:6px;background:color-mix(in srgb,var(--info) 16%,transparent);color:var(--info)}
.tag.pipe{background:color-mix(in srgb,var(--dpipe) 18%,transparent);color:var(--ink)}

/* ---------------- Drawer, rating mode, modals ---------------- */
.drawer{position:fixed;top:0;right:0;height:100vh;width:640px;max-width:100vw;background:var(--panel);border-left:1px solid var(--line2);box-shadow:-12px 0 32px rgba(0,0,0,.35);z-index:40;display:flex;flex-direction:column}
.dhead{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.dhead h3{margin:0;font-size:16px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dbody{padding:14px 18px;overflow-y:auto;flex:1}
.dfoot{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.dbody h4{margin:16px 0 6px;font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute)}
.ferr{color:var(--bad);font-size:11.5px}
.skillgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:4px 14px}
.skillgrid label{display:flex;flex-direction:row;align-items:center;justify-content:space-between;color:var(--ink);font-size:12.5px;gap:8px}
.skillgrid select{width:120px}
html.privacy .drawer input.nm{-webkit-text-security:disc}
.rateov{position:fixed;inset:0;background:rgba(4,6,16,.74);z-index:45;display:flex;justify-content:center;align-items:flex-start;padding:26px 12px;overflow:auto}
.ratecard{background:var(--panel);border:1px solid var(--line2);border-radius:14px;width:880px;max-width:100%;padding:18px 20px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.rname{font-family:var(--disp);font-size:24px;font-weight:700;margin:8px 0 2px}
.rbtns{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.rbtn{flex:1;min-width:140px;padding:10px;border-radius:10px;border:2px solid var(--line2);background:var(--panel2);text-align:left;display:flex;flex-direction:column;justify-content:flex-start;align-self:stretch}
.rbtn b{font-size:22px;display:block;font-family:var(--disp)}
.rbtn span{font-size:11.5px;color:var(--mute)}
.rbtn.on{border-color:var(--acc);background:var(--accsoft)}
.rbtn.r1 b{color:var(--r1)}.rbtn.r2 b{color:var(--r2)}.rbtn.r4 b{color:var(--r4)}.rbtn.r5 b{color:var(--r5)}
.prog{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:6px}
.prog div{height:100%;background:var(--acc)}
#modal-root:empty{display:none}
.mbg{position:fixed;inset:0;background:rgba(4,6,16,.66);z-index:60;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:34px 10px}
.modal{background:var(--panel);color:var(--ink);border:1px solid var(--line2);border-radius:14px;padding:18px 20px;width:900px;max-width:100%;box-shadow:0 18px 50px rgba(0,0,0,.5)}
.modal.sm{width:470px}.modal.md{width:680px}
.modal h3{margin:0 0 10px}
.mbody p{margin:6px 0}
.mbody label{display:flex;flex-direction:column;font-size:12px;color:var(--mute);gap:3px;margin-top:8px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
#toast{position:fixed;left:16px;bottom:16px;background:#1f2540;color:#fff;border:1px solid #39416a;padding:10px 14px;border-radius:10px;z-index:90;display:none;max-width:440px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
#toast.bad{background:#7f1d1d;border-color:#b91c1c}
table.about td:first-child{white-space:nowrap;color:var(--mute)}
textarea.report{width:100%;height:280px;font:12px var(--mono)}

/* ---------------- Overview ---------------- */
.ov{max-width:1800px;margin:0 auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:14px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);text-align:left;display:block;width:100%;color:var(--ink)}
.kpi.btn{cursor:pointer}
.kpi.btn:hover{border-color:var(--accline);background:var(--panel)}
.kpi .kl{font-size:12px;color:var(--mute)}
.kpi .kv{font:700 30px/1.1 var(--disp);margin:4px 0 2px;color:var(--ink)}
.kpi .ks{font-size:12px;color:var(--mute)}
.ovgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(440px,100%),1fr));gap:16px}
.ovgrid .panel{margin-bottom:0}
.ov>.panel{margin-bottom:16px}
.ovgrid .wide{grid-column:1/-1}
.ctitle{font-size:16px;font-weight:600;margin:0!important}
.csub{font-size:12px;color:var(--mute);margin:3px 0 12px}
.legend2{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--mute);margin:10px 0 0}
.legend2 i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.hrow{display:grid;grid-template-columns:minmax(90px,170px) 1fr auto;gap:10px;align-items:center;padding:4px;border-radius:6px;cursor:pointer}
.hrow:hover{background:var(--hover)}
.hrow:focus-visible,.colw:focus-visible,.kpi.btn:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.hrow.nohov{cursor:default}.hrow.nohov:hover{background:none}
.hname{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.htrack{display:flex;gap:2px;height:20px;min-width:4px}
.htrack.thin{height:10px}
.htrack.big{height:24px;margin-top:2px}
.avgtr{display:flex;flex-direction:column;gap:3px}
.hseg{height:100%;min-width:3px}
.hseg:first-child{border-radius:4px 0 0 4px}
.hseg:last-child{border-radius:0 4px 4px 0}
.hseg:only-child{border-radius:4px}
.hnum{font-size:12px;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right}
.cols{display:flex;align-items:flex-end;gap:10px;height:180px;border-bottom:1px solid var(--line2)}
.colw{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;cursor:pointer;border-radius:6px 6px 0 0}
.colw:hover{background:var(--hover)}
.colval{font-size:12px;font-weight:600;margin-bottom:3px}
.colbar{width:26px;border-radius:5px 5px 0 0}
.collab{display:flex;gap:10px;margin-top:6px}
.collab span{flex:1;text-align:center;font-size:12px;color:var(--mute)}
.collab span b{display:inline-flex;min-width:22px;height:20px;align-items:center;justify-content:center;border-radius:5px;font-size:11.5px}
.donuts{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.need{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.need:last-child{border-bottom:0}
.need .nn{font:700 20px var(--disp);min-width:36px;text-align:right}
.need .nt{flex:1}
.need .nt small{display:block;color:var(--mute);font-size:12px}
@keyframes ovx{from{transform:scaleX(.04);opacity:.4}to{transform:scaleX(1);opacity:1}}
@keyframes ovy{from{transform:scaleY(.04);opacity:.4}to{transform:scaleY(1);opacity:1}}
.anim .hseg{transform-origin:left center;animation:ovx .5s cubic-bezier(.2,.8,.25,1) both}
.anim .colbar{transform-origin:bottom center;animation:ovy .5s cubic-bezier(.2,.8,.25,1) both}

/* ---------------- Scenarios: plan cuts ---------------- */
.seg{display:inline-flex;padding:3px;gap:2px;border:1px solid var(--line);border-radius:9px;background:var(--panel)}
.seg button{border:0;border-radius:7px;background:transparent;padding:5px 14px;color:var(--mute)}
.seg button.on{background:var(--accsoft);color:var(--ink);font-weight:600}
.scoreboard{position:sticky;top:calc(var(--hdrH,60px) + var(--tabH,48px));z-index:20;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:0 0 16px;box-shadow:0 6px 16px rgba(0,0,0,.18)}
.sbi{background:var(--panel);padding:12px 14px;min-width:0}
.sbi.wide{grid-column:span 2}
.sbi .kl{font-size:12px;color:var(--mute)}
.sbi .kv{font:700 22px/1.25 var(--disp)}
.sbi .kv small{font-size:13px;color:var(--mute);font-weight:600}
.sbi .ks{font-size:12px;color:var(--mute)}
.sbi .ks.ok-t{color:var(--ok)}.sbi .ks.warn-t{color:var(--warn)}
.sw{position:relative;display:inline-block;width:38px;height:22px;border-radius:11px;padding:0;border:0;background:var(--line2);vertical-align:middle;flex:none}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.sw:hover{background:var(--line2);filter:brightness(1.15)}
.sw.on,.sw.on:hover{background:var(--accbtn)}
.sw.on::after{left:19px}
.tbl tr.imp td{color:var(--mute)}
.tbl tr.imp td:nth-child(2){box-shadow:inset 3px 0 var(--dexit)}
.tbl tr.thr td{background:color-mix(in srgb,var(--r1) 13%,transparent)}
#planCov{scroll-margin-top:calc(var(--hdrH,60px) + var(--tabH,48px) + 150px)}

/* ---------------- Shared services ---------------- */
.split{display:flex;gap:2px;height:9px;border-radius:5px;overflow:hidden;margin-top:5px;max-width:260px}
.split span{height:100%;min-width:3px}
.slg{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:11.5px;color:var(--mute);margin-top:3px}
.slg i,.sdot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:0}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px;align-items:start}
.sgcol{background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;max-height:620px;box-shadow:var(--shadow)}
.smem{display:flex;gap:8px;justify-content:space-between;align-items:flex-start;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 9px;margin-bottom:6px}
.smem.imp{border-left:3px solid var(--dexit)}
.smr{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:12px;white-space:nowrap}
.tcks{display:flex;flex-wrap:wrap;gap:5px}
label.tck{display:inline-flex!important;flex-direction:row!important;align-items:center;gap:5px;border:1px solid var(--line2);border-radius:14px;padding:2px 10px;color:var(--ink)!important;font-size:12px!important;cursor:pointer;margin:0!important}
label.tck:has(input:checked){background:var(--accsoft);border-color:var(--accline)}
.shgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px 14px}

  out.people=[];const ids=new Set();let maxN=0;

    if(o.format>APP.format)throw new Error('This file was saved by a newer version of HOSS (format '+o.format+'). Use that version to open it.');

    if(!Array.isArray(o.people))throw new Error('This file is missing its records section.');

/* Text-only gatekeeper for every file the user opens or imports. */
async function readTextFile(f,kind){
  const name=String(f&&f.name||'').toLowerCase();const ext=name.indexOf('.')>=0?name.slice(name.lastIndexOf('.')+1):'';
  const allowed=kind==='data'?['json']:['csv','tsv','txt'];
  if(allowed.indexOf(ext)<0)throw new Error('Only '+allowed.map(x=>'.'+x).join(', ')+' files are accepted here.'+(kind!=='data'?' To bring in an Excel workbook, use File > Save As > CSV UTF-8, or copy the cells and paste them.':''));
  const max=kind==='data'?LIMITS.dataBytes:LIMITS.csvBytes;
  if(f.size>max)throw new Error('This file is '+mb(f.size)+'. The limit is '+mb(max)+', which keeps HOSS responsive.');
  if(!f.size)throw new Error('The file is empty.');
  const head=new Uint8Array(await f.slice(0,4096).arrayBuffer());
  if(head[0]===0x50&&head[1]===0x4B)throw new Error('This is a compressed file such as an Excel workbook (.xlsx), not plain text. Save it as CSV UTF-8 first, or copy and paste the cells.');
  if(head[0]===0xD0&&head[1]===0xCF)throw new Error('This is an Office binary file (for example .xls), not plain text. Save it as CSV UTF-8 first.');
  if(head[0]===0x25&&head[1]===0x50&&head[2]===0x44&&head[3]===0x46)throw new Error('This is a PDF, not plain text.');
  if(head[0]===0xFF&&head[1]===0xFE)return new TextDecoder('utf-16le').decode(new Uint8Array(await f.arrayBuffer()).subarray(2));
  if(head[0]===0xFE&&head[1]===0xFF)return new TextDecoder('utf-16be').decode(new Uint8Array(await f.arrayBuffer()).subarray(2));
  let ctrl=0;for(let i=0;i<head.length;i++){const b=head[i];if(b===0)throw new Error('This file contains binary data and is not plain text.');if(b<9||(b>13&&b<32&&b!==27))ctrl++;}
  if(ctrl>8)throw new Error('This file does not look like plain text.');
  return await f.text();
}

function isEncText(t){return /"enc"\s*:\s*\{/.test(String(t).slice(0,400));}
async function deriveKey(pw,salt,iter){
  if(!CRYPTO_OK)throw new Error('Encryption is not available in this browser.');
  if(!guard(true))throw new Error('This copy of HOSS is disabled.');
  const base=await crypto.subtle.importKey('raw',utf8Bytes(String(pw).normalize('NFC')),'PBKDF2',false,['deriveKey']);
  const sb=sealBytes(),s2=new Uint8Array(salt.length+sb.length);s2.set(salt,0);s2.set(sb,salt.length);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:s2,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function encryptText(plain){
  if(!ENC||!guard(true))throw new Error('Encryption is not set up.');
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv:iv,additionalData:encAAD(ENC.iter),tagLength:128},ENC.key,utf8Bytes(plain)));
  return JSON.stringify({app:'HOSS',format:APP.format,enc:{v:1,alg:'AES-256-GCM',kdf:'PBKDF2-SHA-256',iter:ENC.iter,salt:ENC.saltB64,iv:b64e(iv),ct:b64e(ct)},meta:{appVersion:APP.version,savedAt:new Date().toISOString(),encrypted:true}},null,1)+'\n';
}
async function decryptEnv(enc,key){
  if(!guard())throw new Error('This copy of HOSS is disabled.');
  try{return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(enc.iv),additionalData:encAAD(enc.iter),tagLength:128},key,b64d(enc.ct)));}
  catch(e){const er=new Error('bad');er.bad=true;throw er;}
}
async function packFile(){const plain=packText();return ENC?await encryptText(plain):plain;}
function renderPwDrop(){const d=$('#pwDrop');if(!d)return;const w=HOME.pw;if(!w){d.hidden=true;d.innerHTML='';return;}
  d.innerHTML='<h4>Unlock your file</h4>'+w.msg+'<input type="password" id="pwInline" autocomplete="off" placeholder="Password" aria-label="Password">'+(w.err?'<p class="bad-t" style="margin:6px 0 0">'+esc(w.err)+'</p>':'')+'<div class="row"><button class="pri" data-act="pwinline">Unlock</button><button data-act="pwcancel">Cancel</button></div>';d.hidden=false;}
function askPassword(title,msg,err){
  if(!loaded&&$('#view')){return new Promise(res=>{HOME.pw={title:title,msg:msg,err:err||'',res:res};renderPwDrop();setTimeout(()=>{const i=$('#pwInline');if(i)i.focus();},40);});}
  return promiseModal('<h3>'+esc(title)+'</h3><div class="mbody">'+msg+'<label>Password<input type="password" id="pwIn" autocomplete="off" autofocus></label>'+(err?'<p class="bad-t">'+esc(err)+'</p>':'')+'</div><div class="mfoot"><button data-act="choose" data-v="">Cancel</button><button class="pri" data-act="pwok">OK</button></div>','sm');}
async function unlockWith(enc,label,tryCurrent){
  if(!validEnc(enc))throw new Error('The encryption header in this file is not recognized.');
  if(tryCurrent&&ENC&&ENC.saltB64===enc.salt&&ENC.iter===enc.iter){try{return{text:await decryptEnv(enc,ENC.key),key:ENC.key};}catch(e){if(!e.bad)throw e;}}
  let err='';
  for(;;){
    const pw=await askPassword('Password required','<p><b>'+esc(label)+'</b> is password protected.</p>',err);
    if(pw==null||pw==='')return null;
    note('Unlocking…');
    const key=await deriveKey(pw,b64d(enc.salt),enc.iter);
    try{return{text:await decryptEnv(enc,key),key:key};}catch(e){if(!e.bad)throw e;err='That password did not work, or the file was changed outside HOSS.';}
  }
}
async function parseMaybeEnc(text,label){
  try{return{r:parseDataText(text),enc:null};}
  catch(e){
    if(!e.encEnv)throw e;
    const u=await unlockWith(e.encEnv,label,true);if(!u)return null;
    return{r:parseDataText(u.text),enc:{key:u.key,salt:b64d(e.encEnv.salt),saltB64:e.encEnv.salt,iter:e.encEnv.iter}};
  }
}
async function readEncSilent(txt){const o=JSON.parse(String(txt).replace(/^﻿/,''));if(!ENC||!validEnc(o.enc)||ENC.saltB64!==o.enc.salt)throw new Error('encrypted with a different password');return parseDataText(await decryptEnv(o.enc,ENC.key));}
async function verifyPw(pw){const e=JSON.parse(await encryptText('x')).enc;const k=await deriveKey(pw,ENC.salt,ENC.iter);try{await decryptEnv(e,k);return true;}catch(x){if(x.bad)return false;throw x;}}

async function ensurePerm(h,manual){
  if(!h||!h.queryPermission)return true;
  let p=await h.queryPermission({mode:'readwrite'});if(p==='granted')return true;
  if(!manual)return false;p=await h.requestPermission({mode:'readwrite'});return p==='granted';
}
async function pickSaveHandle(){
  try{return await window.showSaveFilePicker({suggestedName:ST.fileName||'HOSS-data.json',types:[{description:'HOSS data file',accept:{'application/json':['.json']}}]});}
  catch(e){if(e&&e.name==='AbortError')return null;if(e&&(e.name==='SecurityError'||e.name==='NotAllowedError'||e.name==='TypeError')){ST.mode='download';note('Direct file saving is blocked here. HOSS will download copies instead.',true);return 'download';}throw e;}
}
async function checkConflict(){
  try{const f=await ST.handle.getFile();if(!ST.diskModified||f.lastModified===ST.diskModified)return 'ok';
    const t=await f.text();if(ST.diskText!=null&&t===ST.diskText){ST.diskModified=f.lastModified;return 'ok';}return 'conflict';}
  catch(e){if(e&&e.name==='NotFoundError')return 'missing';throw e;}
}
function downloadName(){const base=(ST.fileName||'HOSS-data').replace(/\.json$/i,'').replace(/-\d{8}-\d{4,6}$/,'');return base+'-'+stamp(true)+'.json';}
async function save(opts){
  opts=opts||{};if(!loaded||!guard())return false;
  if(ST.saving){ST.queued=true;return false;}
  if(opts.saveAs||(!ST.handle&&ST.mode==='direct')){
    if(!opts.manual)return false;
    if(ST.mode==='direct'){const h=await pickSaveHandle();if(!h)return false;
      if(h!=='download'){ST.handle=h;ST.fileName=h.name;ST.diskModified=0;ST.diskText=null;opts.force=true;if(PAUSE.includes(ST.status))ST.status='idle';}}
  }
  if(ST.mode==='download'||!ST.handle){
    if(!opts.manual)return false;
    download(await packFile(),downloadName(),'application/json');
    ST.savedRev=ST.rev;ST.lastSaved=new Date();ST.verified=false;ST.lastDownloadAt=Date.now();setStatus('downloaded');clearEmergency();rememberFile();return true;
  }
  ST.saving=true;setStatus('saving');const rev=ST.rev;let ok=false;
  try{
    if(!(await ensurePerm(ST.handle,opts.manual))){setStatus('perm');return false;}
    if(!opts.force){const c=await checkConflict();
      if(c==='conflict'){setStatus('conflict');if(opts.manual)setTimeout(showConflict,0);return false;}
      if(c==='missing'){setStatus('missing');if(opts.manual)note('The data file can no longer be found. Use Save As to pick a location.',true);return false;}}
    const text=await packFile();
    const w=await ST.handle.createWritable();await w.write(text);await w.close();
    const f=await ST.handle.getFile();const back=await f.text();
    if(back!==text){ST.diskModified=f.lastModified;ST.diskText=back;ST.error='The file on disk does not match what HOSS wrote.';setStatus('verifyfail');if(opts.manual)note('Save could not be verified. Your data is still in this window; use Save As to write a new copy.',true);return false;}
    ST.diskModified=f.lastModified;ST.diskText=text;ST.savedRev=rev;ST.lastSaved=new Date();ST.verified=true;ST.error='';
    setStatus('saved');pulseLogo();clearEmergency();rememberFile();ok=true;
    maybeBackup(text);
    return true;
  }catch(e){
    if(e&&(e.name==='SecurityError'||e.name==='NotAllowedError')&&opts.manual){ST.mode='download';ST.saving=false;note('Direct file saving is blocked here. Downloading a copy instead.',true);return save({manual:true});}
    ST.error=(e&&e.message)||String(e);setStatus('error');if(opts.manual)note('Save failed: '+ST.error,true);return false;
  }finally{
    ST.saving=false;updateStatus();
    if(ok&&(ST.queued||dirty())){ST.queued=false;scheduleAutosave(400);}else ST.queued=false;
  }
}
function setStatus(s){ST.status=s;updateStatus();}
async function showConflict(){
  const v=await choose('The file changed on disk','<p>Someone or something changed <b class="mono">'+esc(ST.fileName)+'</b> after HOSS opened it. This can happen with a second HOSS window, another copy of the tool, or a OneDrive sync.</p><p>Autosave is paused so nothing is overwritten. Choose how to continue:</p>',
    [{id:'cancel',label:'Decide later'},{id:'saveas',label:'Save mine as a new file'},{id:'load',label:'Load the file\'s version'},{id:'overwrite',label:'Overwrite with mine',cls:'warn'}],'md');
  if(v==='overwrite'){ST.status='idle';await save({manual:true,force:true});}
  else if(v==='saveas'){ST.status='idle';await save({manual:true,saveAs:true});}
  else if(v==='load'){await backupBefore('pre-reload');try{const f=await ST.handle.getFile();const text=await readTextFile(f,'data');const h=ST.handle;if(await loadText(text,{name:h.name})){ST.handle=h;ST.fileName=h.name;ST.diskModified=f.lastModified;ST.diskText=text;ST.status='loaded';updateStatus();note('Loaded the version on disk. Your previous version was kept as a backup or recovery copy.');}}catch(e){note('Could not load: '+e.message,true);}}
}
async function confirmDiscard(){
  if(!loaded||!dirty())return true;

async function loadText(text,opts){

  if(r.checksumOk===false){
    const v=await choose('Checksum does not match','<p>The contents of this file do not match the checksum HOSS stamped when it was saved. It may have been edited outside HOSS (for example in Notepad) or partly damaged.</p><p>You can open it and review the data, or cancel and restore a backup instead.</p>',[{id:'cancel',label:'Cancel',cls:'pri'},{id:'open',label:'Open anyway',cls:'warn'}]);
    if(v!=='open')return false;

  DB=nd;if(!opts.keepEnc)ENC=newEnc;resetNextId();undoStack=[];redoStack=[];UI.selected.clear();UI.panel=null;UI.rate=null;UI.filters=defFilters();loaded=true;
  ST.checksumAtLoad=r.checksumOk;ST.legacy=r.legacy;ST.handle=null;ST.fileName=opts.name||'';ST.diskModified=0;ST.diskText=null;ST.verified=false;ST.lastSaved=r.meta&&r.meta.savedAt?new Date(r.meta.savedAt):null;ST.status='loaded';

  note('Opened '+live().length+' records');
  return true;
}

async function backupPermOK(manual){
  if(!ST.backupDir)return false;
  try{if(!ST.backupDir.queryPermission){ST.backupPerm=true;return true;}let p=await ST.backupDir.queryPermission({mode:'readwrite'});
    if(p!=='granted'&&manual)p=await ST.backupDir.requestPermission({mode:'readwrite'});ST.backupPerm=p==='granted';return ST.backupPerm;}
  catch(e){ST.backupPerm=false;return false;}
}
async function reconnectBackups(manual){if(!ST.backupDir){const d=await idbGet('backupDir');if(d){ST.backupDir=d;ST.backupDirName=d.name||'';}}if(ST.backupDir)await backupPermOK(manual);updateStatus();}
async function chooseBackupDir(){

  try{const d=await window.showDirectoryPicker({id:'hoss-backups',mode:'readwrite'});ST.backupDir=d;ST.backupDirName=d.name;ST.backupPerm=true;await idbSet('backupDir',d);

async function writeFileIn(dir,name,text){const fh=await dir.getFileHandle(name,{create:true});const w=await fh.createWritable();await w.write(text);await w.close();}
async function writeBackup(text,label){
  if(!ST.backupDir||!(await backupPermOK(false)))return false;
  try{const name='HOSS-backup-'+stamp(true)+(label?'-'+label.replace(/[^a-z0-9-]/gi,''):'')+'.json';
    await writeFileIn(ST.backupDir,name,text);await writeFileIn(ST.backupDir,'HOSS-daily-'+dayStamp()+'.json',text);
    ST.lastBackupAt=Date.now();ST.lastBackupName=name;ST.backupError='';await pruneBackups();updateStatus();return true;}
  catch(e){ST.backupError=e.message;updateStatus();return false;}
}
async function maybeBackup(text){if(!ST.backupDir||Date.now()-ST.lastBackupAt<LIMITS.backupEveryMs)return;await writeBackup(text,'');}
async function backupBefore(label){let ok=false;try{ok=await writeBackup(await packFile(),label);}catch(e){}await writeSnapshot(true);return ok;}
async function listBackups(){
  if(!ST.backupDir||!(await backupPermOK(false)))return null;const out=[];
  try{for await(const h of ST.backupDir.values()){if(h.kind==='file'&&/^HOSS-(backup|daily)-.*\.json$/.test(h.name)){try{const f=await h.getFile();out.push({name:h.name,size:f.size,modified:f.lastModified});}catch(e){}}}}catch(e){return null;}
  return out.sort((a,b)=>b.modified-a.modified||cmpStr(b.name,a.name));

async function pruneBackups(){
  const all=await listBackups();if(!all)return;
  const b=all.filter(x=>/^HOSS-backup-/.test(x.name)).sort((x,y)=>cmpStr(y.name,x.name));
  for(const x of b.slice(LIMITS.backups)){try{await ST.backupDir.removeEntry(x.name);}catch(e){}}
  const cutoff=new Date(Date.now()-LIMITS.dailyDays*86400000);const cut=dayStamp(cutoff);
  for(const x of all.filter(x=>/^HOSS-daily-\d{8}\.json$/.test(x.name))){if(x.name.slice(11,19)<cut){try{await ST.backupDir.removeEntry(x.name);}catch(e){}}}
}
async function restoreText(text,label){

async function renameTeam(old){
  if(!old||old===TBDTEAM||old==='(no team)'){note('That group cannot be renamed.',true);return;}
  const n=await askText('Rename team','New name for "'+old+'"',old);
  if(!n||n===old)return;
  if(n===TBDTEAM||n==='(no team)'){note('That name is reserved.',true);return;}
  const other=allTeams().find(t=>t!==old&&t.toLowerCase()===n.toLowerCase());
  const target=other||n;
  if(other&&!(await confirmBox('Merge teams','<p>A team named <b>'+esc(other)+'</b> already exists. Renaming <b>'+esc(old)+'</b> to it merges the two teams. Undo is available.</p>','Merge')))return;
  mutate(()=>{
    DB.people.forEach(p=>{if(p.team===old)p.team=target;});
    DB.settings.extraTeams=Array.from(new Set((DB.settings.extraTeams||[]).map(t=>t===old?target:t)));
    DB.scenarios.forEach(x=>Object.keys(x.disp).forEach(id=>{const d=x.disp[id];if(d&&d.a==='redeploy'&&d.to===old){d.to=target;const p=byId(id);if(p&&p.team===target)x.disp[id]={a:'retain',to:''};}}));
    (DB.settings.views||[]).forEach(v=>{const f=v.filters;if(f&&f.facets&&f.facets.team===old)f.facets.team=target;});
  });
  if(UI.filters&&UI.filters.facets&&UI.filters.facets.team===old)UI.filters.facets.team=target;
  if(UI.match&&UI.match.team===old)UI.match.team=target;
  if(UI.rate&&UI.rate.team===old){UI.rate.team=target;UI.rate.ids=rateIds(target,UI.rate.only,UI.rate.base);UI.rate.i=0;}
  render();note('Renamed "'+old+'" to "'+target+'". Only the team name changed on each member.');
}

function statusInfo(){

  if(s==='conflict')return{c:'bad',t:'Changed on disk',tip:'The file changed on disk after HOSS opened it. Click to choose what to do.'};

  if(s==='missing')return{c:'bad',t:'File not found',tip:'The data file can no longer be found. Click to save it somewhere new.'};
  if(s==='verifyfail'||s==='error')return{c:'bad',t:'Save failed',tip:(ST.error?ST.error+' ':'')+'Click to try again.'};

function teamStats(scn){
  const M={};const get=t=>M[t]||(M[t]={t:t,cur:0,fte:0,rs:0,rn:0,dist:[0,0,0,0,0,0],exit:0,out:0,inn:0,und:0,ret:0,proj:0,pfte:0,prs:0,prn:0,open:0,openProj:0,closed:0,tbd:0,pipe:0});
  allTeams().forEach(get);
  live().forEach(p=>{const d=dispOf(p,scn);const s=get(tm(p));
    if(p.vacant){s.open++;if(d.a==='exit')s.closed++;else{s.openProj++;if(bstat(p,scn)==='pipeline')s.pipe++;}return;}
    s.cur++;s.fte+=fte(p);if(p.rating){s.rs+=p.rating;s.rn++;}s.dist[p.rating||0]++;
    if(d.a==='exit')s.exit++;else if(d.a==='redeploy'&&d.to&&d.to!==tm(p)){s.out++;get(d.to).inn++;}else if(d.a==='redeploy'&&!d.to){s.out++;s.tbd++;get(TBDTEAM).inn++;}else if(d.a==='retain')s.ret++;else s.und++;
    const et=effTeam(p,scn);if(et){const e=get(et);e.proj++;e.pfte+=fte(p);if(p.rating){e.prs+=p.rating;e.prn++;}}});
  const list=Object.keys(M).map(k=>M[k]).sort((a,b)=>((a.t===TBDTEAM)-(b.t===TBDTEAM))||cmpStr(a.t,b.t));
  const tot={t:'TOTAL',cur:0,fte:0,rs:0,rn:0,dist:[0,0,0,0,0,0],exit:0,out:0,inn:0,und:0,ret:0,proj:0,pfte:0,prs:0,prn:0,open:0,openProj:0,closed:0,tbd:0,pipe:0};
  list.forEach(s=>{Object.keys(tot).forEach(k=>{if(typeof tot[k]==='number')tot[k]+=s[k];});s.dist.forEach((n,i)=>tot.dist[i]+=n);});
  return{list:list,tot:tot};
}

async function unprotectedBackups(){
  const all=await listBackups();if(!all)return null;const out=[];
  for(const b of all){try{const fh=await ST.backupDir.getFileHandle(b.name);const f=await fh.getFile();const head=await f.slice(0,400).text();if(!isEncText(head))out.push(b.name);}catch(e){}}
  return out;
}
async function deleteUnprotected(){
  if(!ENC){note('Password protection is off.',true);return;}
  if(!ST.backupDir){note('No backups folder is set.',true);return;}
  const u=await unprotectedBackups();if(!u){note('The backups folder needs permission first. Use Reconnect.',true);return;}
  if(!u.length){note('No unprotected backups found.');return;}
  if(!(await typeConfirm('Delete unprotected backups','<p>Permanently delete the older backup files that are not password protected ('+u.length+' found)? A fresh protected backup is written first.</p>','DELETE')))return;
  if(!(await writeBackup(await packFile(),'protected'))){note('Could not write a protected backup first, so nothing was deleted.',true);return;}
  const again=(await unprotectedBackups())||[];let n=0;
  for(const name of again){try{await ST.backupDir.removeEntry(name);n++;}catch(e){}}
  render();note('Deleted '+n+' unprotected backup file(s).');
}
async function pwFlow(kind){
  if(!loaded){note('Open or start a data file first.',true);return;}
  if(!CRYPTO_OK){await info('Not available','This browser setup does not offer the built-in encryption HOSS uses.');return;}
  if(kind!=='set'){
    const cur=await askPassword('Confirm current password','<p>Enter the current password to continue.</p>');
    if(cur==null)return;
    note('Checking…');
    if(!(await verifyPw(cur))){await info('Wrong password','That is not the current password. Nothing was changed.');return;}
  }
  if(kind==='remove'){
    if(!(await confirmBox('Remove password','<p>The data file, new backups and new recovery copies will no longer be password protected. Older protected backups stay protected and still need the old password.</p>','Remove password',true)))return;
    await backupBefore('pre-unprotect');
    ENC=null;changed();
    const ok=await save({manual:true});
    await clearRecovery();await writeSnapshot(true);
    render();note(ok?'Password removed. The file was saved without protection.':'Password removed in this window. Save to apply it to the file.');return;
  }
  const pw=await pwFormModal(kind==='change'?'Change password':'Set a password',kind==='change'?'<p>Backups made with the old password still need the old password.</p>':'<p>This protects the data file, new backups and recovery copies kept in this browser. HOSS cannot recover a lost password.</p>');
  if(!pw)return;
  note('Setting up protection…');
  let key,salt;
  try{salt=crypto.getRandomValues(new Uint8Array(16));key=await deriveKey(pw,salt,KDF_ITER);}catch(e){note('Could not set the password: '+e.message,true);return;}
  await backupBefore(kind==='change'?'pre-pwchange':'pre-password');
  ENC={key:key,salt:salt,saltB64:b64e(salt),iter:KDF_ITER};
  clearEmergency();changed();
  const ok=await save({manual:true});
  await clearRecovery();await writeSnapshot(true);
  render();
  if(!ok){note('The password is set in this window, but the file is not saved yet. Save to protect it on disk.',true);return;}
  note('Password set. The file was saved with protection.');
  if(kind==='set'&&ST.backupDir){const u=await unprotectedBackups();if(u&&u.length)await info('Older backups are not protected','<p>'+u.length+' older backup file(s) in your backups folder were made before the password and can be opened without it. You can delete them under Data &amp; Setup, Password protection.</p>');}
}

function healthChecks(){
  const L=live(),F=L.filter(p=>!p.vacant),out=[],today=todayISO();
  const add=(label,level,list,tip)=>out.push({label:label,level:level,ids:list.map(p=>p.id),tip:tip||''});
  const dup=(arr,key)=>{const g={};arr.forEach(p=>{const k=String(p[key]||'').trim().toLowerCase();if(k)(g[k]=g[k]||[]).push(p);});return [].concat.apply([],Object.keys(g).filter(k=>g[k].length>1).map(k=>g[k]));};
  add('Duplicate billets','bad',dup(L,'billet'),'Each billet should appear once.');
  add('Duplicate e-mails','bad',dup(F,'cisaEmail'));
  add('Missing name (filled positions)','bad',F.filter(p=>!p.first&&!p.last),'Add a name, or mark the record as a vacant billet.');
  add('Missing team','warn',L.filter(p=>!p.team));
  add('Unrated people','warn',F.filter(p=>!p.rating),'Use Rating mode to rate quickly.');
  add('Invalid e-mail format','warn',F.filter(p=>(p.cisaEmail&&!EMAIL.test(p.cisaEmail))||(p.nwEmail&&!EMAIL.test(p.nwEmail))));
  add('% FTE not 0 to 100','warn',L.filter(p=>fteIssue(p.pctFte)));
  add('Offboard date not a valid date','warn',L.filter(p=>p.offboardDate&&!validISO(p.offboardDate)));
  add('Offboard date has passed but not marked Exit','warn',F.filter(p=>validISO(p.offboardDate)&&p.offboardDate<today&&dispOf(p).a!=='exit'));
  add('Vacant billet with no billet number','warn',L.filter(p=>p.vacant&&!p.billet));
  add('Skill levels on skills no longer in your list','info',F.filter(p=>Object.keys(p.skills||{}).some(k=>!DB.skills.includes(k))),'Levels are kept. Add the skill back to the list to see them.');
  add('No skills recorded','info',F.filter(p=>!topSkills(p).length));
  add('Shared-service time over 100%','bad',F.filter(p=>sharedOf(p).reduce((a,x)=>a+(x.pct||0),0)>100),'Lower the percentages in the profile.');
  add('Target fill date not a valid date','warn',L.filter(p=>p.vacant&&p.pipeDate&&!validISO(p.pipeDate)));
  add('System tags not in your list','info',L.filter(p=>sysOf(p).some(s=>sysList().indexOf(s)<0)),'Tags are kept. Add them to the list under Data & Setup to use them as filters.');
  add('Redeploy decided, destination team not set','info',F.filter(p=>isTBD(p)),'Active scenario. Place them with the Redeploy Matcher or the Team Board.');
  return out;
}

async function runIntegrity(){
  const L=[];const P=(s,t)=>L.push({s:s,t:t});
  try{
    P(Array.isArray(DB.people)&&Array.isArray(DB.scenarios)&&DB.scenarios.length?'PASS':'FAIL','Data structure: '+DB.people.length+' records ('+live().length+' active), '+DB.scenarios.length+' scenario(s), '+DB.skills.length+' skills');
    const ids=DB.people.map(p=>p.id);P(new Set(ids).size===ids.length?'PASS':'FAIL','Internal IDs are unique');
    let orphans=0;DB.scenarios.forEach(s=>Object.keys(s.disp).forEach(id=>{if(!byId(id))orphans++;}));P(orphans?'WARN':'PASS',orphans?orphans+' scenario decision(s) point to missing records (open and save the file to clean up)':'Scenario decisions all point to existing records');
    P(DB.scenarios.some(s=>s.id===DB.active)?'PASS':'FAIL','Active scenario exists');
    const badR=DB.people.filter(p=>!(Number.isInteger(p.rating)&&p.rating>=0&&p.rating<=5)).length;P(badR?'FAIL':'PASS','Ratings are whole numbers 0 to 5'+(badR?' ('+badR+' bad)':''));
    const badS=DB.people.filter(p=>Object.keys(p.skills||{}).some(k=>!(p.skills[k]>=1&&p.skills[k]<=4))).length;P(badS?'FAIL':'PASS','Skill levels are 1 to 4'+(badS?' ('+badS+' bad)':''));
    P(sha256('abc')==='ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad'?'PASS':'FAIL','SHA-256 self-test');
    const t=packText();const r=parseDataText(t);const same=JSON.stringify(normalize(r.data,[]))===JSON.stringify(normalize(JSON.parse(JSON.stringify(DB)),[]));
    P(r.checksumOk&&same?'PASS':'FAIL','Save format round trip (pack, checksum, re-read, compare)');
    if(ENC){const t2=await packFile();const r2=await readEncSilent(t2);P(r2.checksumOk&&r2.data.people.length===DB.people.length?'PASS':'FAIL','Password protection is on: encrypted save round trip (AES-256-GCM)');}else P('PASS','Password protection is off (optional)');
    if(ST.handle){
      try{if(await ensurePerm(ST.handle,false)){const f=await ST.handle.getFile();const txt=await f.text();const d=isEncText(txt)?await readEncSilent(txt):parseDataText(txt);
          P(d.checksumOk?'PASS':'FAIL','File on disk ('+ST.fileName+', '+mb(f.size)+') checksum '+(d.checksumOk?'matches':'does NOT match'));
          if(!dirty()){const eq=JSON.stringify(normalize(d.data,[]))===JSON.stringify(normalize(JSON.parse(JSON.stringify(DB)),[]));P(eq?'PASS':'WARN','File on disk '+(eq?'matches':'differs from')+' the data in this window');}
          else P('WARN','There are unsaved changes, so the file on disk is older than this window');}
        else P('WARN','No permission to read the data file right now (click Save once to allow)');}
      catch(e){P('FAIL','Could not read the data file: '+e.message);}
    }else P(ST.mode==='download'?'WARN':'WARN',ST.mode==='download'?'Download mode: the newest downloaded copy is your master file':'No data file chosen yet');
    if(ST.backupDir){const b=await listBackups();P(b?'PASS':'WARN',b?'Backups folder reachable: '+b.length+' backup file(s)'+(b[0]?', newest '+b[0].name:''):'Backups folder needs permission');}
    else P('WARN','No backups folder chosen');
    P(recoveryOn()?'PASS':'WARN','Recovery copies in this browser: '+(recoveryOn()?'on':'off'));
  }catch(e){P('FAIL','Integrity check error: '+e.message);}
  const txt='HOSS integrity check '+APP.version+' | '+new Date().toLocaleString()+'\n'+L.map(x=>x.s+'  '+x.t).join('\n');
  showModal('<h3>Integrity check</h3><table class="tbl"><tbody>'+L.map(x=>'<tr><td class="'+(x.s==='PASS'?'ok-t':x.s==='WARN'?'warn-t':'bad-t')+'"><b>'+x.s+'</b></td><td>'+esc(x.t)+'</td></tr>').join('')+'</tbody></table><details><summary>Copy as text</summary><textarea class="report" readonly>'+esc(txt)+'</textarea></details><div class="mfoot"><button class="pri" data-act="mclose">Close</button></div>','md');
  return L;
}

function run(f,t,e){try{const r=f(t,e);if(r&&r.catch)r.catch(err=>note('Something went wrong: '+((err&&err.message)||err),true));}catch(err){note('Something went wrong: '+err.message,true);if(window.console)console.error(err);}}
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target&&e.target.matches&&e.target.matches('.hrow[tabindex],.colw[tabindex]')){e.preventDefault();e.target.click();}});
document.addEventListener('click',e=>{if(UI.aopen===true&&!ADMIN_TABS.includes(UI.tab)&&!(e.target.closest&&e.target.closest('#admin'))){UI.aopen=undefined;const a=$('#admin'),b=$('#admBtn');if(a)a.classList.remove('open');if(b)b.setAttribute('aria-expanded','false');}if(UI.fopen&&!(e.target.closest&&e.target.closest('.fwrap')))CLICK.fclose();const hm=$('#hmenu');if(hm&&!hm.hidden&&!e.target.closest('.hmenuwrap')){hm.hidden=true;$('#hmenuBtn').setAttribute('aria-expanded','false');}else if(hm&&!hm.hidden&&e.target.closest('#hmenu')&&e.target.closest('[data-act]')&&e.target.closest('[data-act]').dataset.act!=='privacy'){hm.hidden=true;$('#hmenuBtn').setAttribute('aria-expanded','false');}const t=e.target.closest('[data-act]');if(!t)return;const f=CLICK[t.dataset.act];if(!f)return;if(t.tagName==='A')e.preventDefault();if(t.tagName==='INPUT'||t.tagName==='SELECT')return;run(f,t,e);});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='openIn'||t.id==='csvIn'||t.id==='mergeIn'){const file=t.files&&t.files[0];t.value='';if(!file)return;
    if(t.id==='openIn')run(async()=>{if(!(await confirmDiscard()))return;try{const text=await readTextFile(file,'data');if(await loadText(text,{name:file.name})){ST.mode='download';updateStatus();rememberFile();}}catch(err){await info('Can\'t open this file',esc(err.message));}});
    else if(t.id==='csvIn')run(async()=>{try{const text=await readTextFile(file,'table');const tb=parseTable(text);startPlan(recordsFromRows(tb.rows),'csv',tb.truncated);}catch(err){await info('Can\'t import this file',esc(err.message));}});
    else run(async()=>{try{const text=await readTextFile(file,'data');const m=await parseMaybeEnc(text,file.name);if(!m)return;const r=m.r;if(r.checksumOk===false&&!(await confirmBox('Checksum does not match','<p>The file to merge failed its checksum check. Merge it anyway?</p>','Continue')))return;startPlan(recordsFromData(r.data),'merge');}catch(err){await info('Can\'t merge this file',esc(err.message));}});
    return;}
  if(t.dataset&&t.dataset.shpick){if(UI.shpick){if(t.checked)UI.shpick.sel.add(t.dataset.shpick);else UI.shpick.sel.delete(t.dataset.shpick);const n=$('#shpN');if(n)n.textContent=UI.shpick.sel.size+' selected';}return;}
  if(t.dataset&&t.dataset.shg!==undefined){updateSplit();return;}
  if(t.closest('[data-colk]'))return;
  const el=t.closest('[data-act]');if(!el)return;const f=CHANGE[el.dataset.act];if(f)run(f,el,e);});
document.addEventListener('input',e=>{const t=e.target;if(!t.dataset)return;
  if(t.dataset.act==='q'){UI.filters.q=t.value;renderRosterTable();}
  else if(t.dataset.act==='bq'){UI.board.q=t.value;const pos=t.selectionStart;render();const n=$('[data-act="bq"]');if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(x){}}}
  else if(t.dataset.act==='plq'){UI.scen.q=t.value;planFill();}
  else if(t.dataset.act==='shq'){UI.shared.q=t.value;const pos=t.selectionStart;render();const n=$('[data-act="shq"]');if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(x){}}}
  else if(t.dataset.act==='shpq'){if(UI.shpick){UI.shpick.q=t.value;shpFill();}}
  else if(t.dataset.shp!==undefined){if(String(t.value).trim()){const c=$$('#editForm input[data-shg]').find(x=>x.dataset.shg===t.dataset.shp);if(c)c.checked=true;}updateSplit();}
  else if(t.name==='team'&&t.form&&t.form.id==='editForm')updateSplit();});
/* Browser Back (button, Alt+Left, mouse back) stays inside HOSS. A fresh history entry is added on the
   next click or key press after each use, so Chromium treats it as user-created and does not skip it. */
window.addEventListener('popstate',()=>{NAV.gest=false;armHistory();run(goBack);});
const navGesture=()=>{if(!NAV.gest){NAV.gest=true;armHistory();}};
document.addEventListener('pointerdown',navGesture,true);document.addEventListener('keydown',navGesture,true);
window.addEventListener('resize',stickyVars);
document.addEventListener('toggle',e=>{const t=e.target;if(t&&t.dataset&&t.dataset.act==='rskillsdet')lsSet('hoss_rate_skills',t.open?'open':'closed');},true);
/* Drag and drop on the Team Board. Files dropped on the page are refused so the browser never navigates away. */
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('.bcard[draggable]');if(!c)return;e.dataTransfer.setData('text/plain',c.dataset.id);e.dataTransfer.effectAllowed='move';c.classList.add('dragging');});
document.addEventListener('dragend',()=>{$$('.bcard.dragging').forEach(x=>x.classList.remove('dragging'));$$('.bcol.over').forEach(x=>x.classList.remove('over'));});
const isFileDrag=e=>e.dataTransfer&&Array.from(e.dataTransfer.types||[]).indexOf('Files')>=0;
document.addEventListener('dragover',e=>{if(isFileDrag(e)){e.preventDefault();e.dataTransfer.dropEffect='none';return;}const col=e.target.closest&&e.target.closest('.bcol');if(!col)return;e.preventDefault();e.dataTransfer.dropEffect='move';$$('.bcol.over').forEach(x=>{if(x!==col)x.classList.remove('over');});col.classList.add('over');});
document.addEventListener('drop',e=>{if(isFileDrag(e)){e.preventDefault();note('To bring in a file, use Open or Import so it can be checked first.');return;}const col=e.target.closest&&e.target.closest('.bcol');if(!col)return;e.preventDefault();col.classList.remove('over');const id=e.dataTransfer.getData('text/plain');if(id)boardDrop(id,col.dataset.team);});
document.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase(),typing=tag==='input'||tag==='textarea'||tag==='select';const ctrl=e.ctrlKey||e.metaKey,k=(e.key||'').toLowerCase();
  if(ctrl&&k==='s'){e.preventDefault();CLICK.savefile();return;}
  if(HOME.pw&&e.target.id==='pwInline'){if(e.key==='Enter'){e.preventDefault();CLICK.pwinline($('[data-act="pwinline"]'));return;}if(e.key==='Escape'){CLICK.pwcancel();return;}}
  if(e.key==='Escape'){if($('#modal-root').innerHTML){closeModal();return;}if(UI.rate){CLICK.rclose();return;}if(UI.panel){CLICK.pclose();return;}if(UI.fopen){CLICK.fclose();const fb=$('#fBtn');if(fb)fb.focus();return;}if(UI.aopen===true&&!ADMIN_TABS.includes(UI.tab)){CLICK.admin();const ab=$('#admBtn');if(ab)ab.focus();return;}}
  if($('#modal-root').innerHTML){if(e.key==='Enter'&&e.target.id==='txIn')CLICK.txok();if(e.key==='Enter'&&e.target.id==='tcIn')CLICK.tcok($('[data-act="tcok"]'));if(e.key==='Enter'&&e.target.id==='pwIn')CLICK.pwok();if(e.key==='Enter'&&(e.target.id==='pw1'||e.target.id==='pw2'))CLICK.pwset();return;}
  if(UI.rate&&!typing&&!ctrl){if(/^[0-5]$/.test(e.key)){e.preventDefault();rateSet(+e.key);return;}if(e.key==='ArrowRight'||e.key==='Enter'){e.preventDefault();CLICK.rnav({dataset:{d:1}});return;}if(e.key==='ArrowLeft'){e.preventDefault();CLICK.rnav({dataset:{d:-1}});return;}if(k==='k'){rateFlag('critical');return;}if(k==='r'){rateFlag('redeploy');return;}}
  if(!typing&&ctrl&&k==='z'){e.preventDefault();undo();}
  if(!typing&&ctrl&&k==='y'){e.preventDefault();redo();}
  if(!typing&&!ctrl&&e.key==='/'&&loaded&&UI.tab==='roster'&&!UI.panel&&!UI.rate){e.preventDefault();const q=$('#qIn');if(q)q.focus();}
});
window.addEventListener('beforeunload',e=>{if(loaded&&dirty()){writeEmergency();e.preventDefault();e.returnValue='';}});
window.addEventListener('pagehide',()=>{writeEmergency();});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&loaded&&dirty()){writeEmergency();if(ST.mode==='direct'&&ST.handle&&ST.autosave&&!PAUSE.includes(ST.status))save({});}});
setInterval(()=>{if(!guard(true))return;if(loaded&&dirty())scheduleAutosave(10);renderBanners();},60000);

   27. START
   ========================================================================= */
/* Reopen the last data file at launch. If Edge already holds permission for it, it opens with no click.
   Otherwise Home shows a focused "Reopen last file" button, because Edge only allows the permission prompt from a click. */
async function autoResume(){
  const L=HOME.last;
  if(loaded||!L||!L.handle||!FSA||lsGet('hoss_autoreopen')==='off')return;
  let st='prompt';
  try{st=await L.handle.queryPermission({mode:'readwrite'});}catch(e){st='error';}
  if(st==='granted'){HOME.auto='opening';render();const ok=await openHandle(L.handle,true);HOME.auto=ok?'':'failed';if(!ok)render();}
  else if(st==='prompt'){HOME.auto='needclick';render();}
}
async function refreshHome(){HOME.last=(await idbGet('lastFile'))||null;HOME.snaps=await getSnaps();HOME.emerg=getEmergency();}
async function start(){
  if(!guard(true))return;
  const th=lsGet('hoss_theme');if(th==='light'||th==='dark')document.documentElement.dataset.theme=th;
  $('#logoSlot').innerHTML=logoSVG(false);$('#viewSwHost').innerHTML=swHTML(false);$('#legalBar').innerHTML='<div>'+esc(APP.copyright)+'</div><div class="lb2">'+esc(APP.name)+' '+esc(APP.version)+' · Proprietary software · <button class="link" data-act="license">License notice</button></div>';
  $('#verTag').textContent='v'+APP.version;
  try{history.replaceState({hoss:0},'');}catch(e){}armHistory();
  render();
  if(window.ResizeObserver)try{new ResizeObserver(stickyVars).observe($('header.top'));}catch(e){}
  await idbOpen();
  const d=await idbGet('backupDir');if(d){ST.backupDir=d;ST.backupDirName=d.name||'';try{if(d.queryPermission)ST.backupPerm=(await d.queryPermission({mode:'readwrite'}))==='granted';else ST.backupPerm=true;}catch(e){ST.backupPerm=false;}}
  await refreshHome();
  if(!loaded)render();
  await autoResume();
}
start();
})();
